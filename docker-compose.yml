services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventroute-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - eventroute-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventroute-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eventroute-network

networks:
  eventroute-network:
    driver: bridge
